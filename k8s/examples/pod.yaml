apiVersion: v1
kind: Pod
metadata:
  name: ubuntu
  labels:
    app: nginx
    env: dev
spec:
  containers:
  - name: ubuntu
    image: ubuntu:22.04
    command: ["sleep"]
    args: ["3600000"]
    env:
    - name: MESSAGE
      value: "hello world"
    - name: MESSAGE2
      value: "hello world!"
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
