version: "2"

services:
  web:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - flask1
      - flask2

  flask1:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    expose:
      - "80"

  flask2:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    expose:
      - "80"

  redis:
    image: redis