docker-compose:
  name: task_manager_dev
  services:
    adminer:
      image: adminer
      ports:
      - 8080:8080
      restart: always
    backend:
      cap_drop:
      - ALL
      command: 'sh -c " uv run python manage.py migrate && uv run python manage.py
        collectstatic --noinput && uv run gunicorn --workers=4 --bind 0.0.0.0:8000
        task_manager.wsgi:application "

        '
      depends_on:
        db:
          condition: service_healthy
      env_file:
      - .env
      healthcheck:
        interval: 30s
        retries: 5
        start_period: 60s
        test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000')
        timeout: 10s
      image: volkbav/task_manager
      ports:
      - 8000:8000
      restart: always
      security_opt:
      - no-new-privileges:true
      volumes:
      - static:/static
    db:
      env_file:
      - .env
      healthcheck:
        interval: 5s
        retries: 5
        test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
        timeout: 5s
      image: postgres:16.3
      restart: always
      shm_size: 128mb
      volumes:
      - pgdata:/var/lib/postgresql/data
  volumes:
    pgdata: null
    static: null
docker-compose1:
  name: my_file_for_docker
  services:
    backend:
      cap_drop:
      - ALL
      command: 'sh -c " uv run python manage.py migrate && uv run python manage.py
        collectstatic --noinput && uv run gunicorn --workers=4 --bind 0.0.0.0:8000
        task_manager.wsgi:application "

        '
      depends_on:
        db:
          condition: service_healthy
      env_file:
      - .env
      image: volkbav/task_manager
      restart: always
      security_opt:
      - no-new-privileges:true
      volumes:
      - static:/static
    certbot:
      command: 'certonly --webroot --webroot-path=/var/www/certbot --email example@example.com
        --agree-tos --no-eff-email -d example.com -d www.example.com

        '
      depends_on:
      - nginx
      image: certbot/certbot
      restart: 'no'
      volumes:
      - ./certbot/certbot_www:/var/www/certbot
      - ./certbot/certbot_etc:/etc/letsencrypt
    db:
      env_file:
      - .env
      healthcheck:
        interval: 5s
        retries: 5
        test:
        - CMD-SHELL
        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
        timeout: 5s
      image: postgres:16.3
      restart: always
      shm_size: 128mb
      volumes:
      - pgdata:/var/lib/postgresql/data
    nginx:
      build: ./nginx
      depends_on:
      - backend
      ports:
      - 80:80
      - 443:443
      restart: always
      volumes:
      - ./certbot/certbot_www:/var/www/certbot
      - ./certbot/certbot_etc:/etc/letsencrypt
      - static:/static
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  volumes:
    pgdata: null
    static: null
